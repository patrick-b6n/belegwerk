[package]
name = "belegwerk"
# Unused: the exe's version comes from package.json (tauri.conf.json), which
# the release scripts set from the build time (CalVer).
version = "0.1.0"
description = "Belegwerk – income/expenses and Anlage EÜR"
authors = ["Patrick"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "belegwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
# Stripe client (#29); without cookie store (Stripe needs none).
tauri-plugin-http = { version = "2.9.0", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
] }
# `tauri::generate_context!` needs it once tauri.conf.json configures a plugin (`plugins.http`).
serde_json = "1"
# Second start focuses the running window (#33).
tauri-plugin-single-instance = "2.5.5"
# Auto-update from GitHub releases (#71, src/updater.rs). reqwest 0.12 with the
# same TLS stack (rustls) and features tauri-plugin-http already uses, so no
# second TLS implementation ends up in the exe.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.10"
# Opens the release notes in the default browser (#71); the capability allows
# only this repository's release pages.
tauri-plugin-opener = "2.7.3"
tauri-plugin-window-state = "2"

# Release build for the single .exe (#33, `pnpm release`; CI builds the same
# profile). Size and speed instead of build time: one codegen unit and full
# LTO let LLVM optimize across all crates, `strip` removes the debug symbols
# (no .pdb is shipped anyway). `panic` stays `unwind`: a panic in a plugin
# command then fails that call instead of killing the window.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
