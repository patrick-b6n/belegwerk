name: Release

# Every push to main builds the .exe and creates a GitHub release tagged
# `v<YYYY-MM-DD-HHMM>` (#71, #74). On startup the app checks the latest
# release and updates itself from it (docs/release.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: releases from main are created one after another, none
# is cancelled (the version depends on the most recently created tag). A
# workflow_dispatch on another branch lands in its own group and does not
# displace a pending main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release (windows-latest)
    # workflow_dispatch works on any branch; releases only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # gh release create
      contents: write
    steps:
      # Only the current head of main is published. A re-run of an old run
      # would otherwise publish older code as "Latest"; its commits are
      # included in the newer run's release. Checked again before
      # `gh release create`.
      - name: Check head of main
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release: $GITHUB_SHA is no longer the head of main ($head); the newer run publishes these commits."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json (pnpm 12).
      - name: Setup pnpm
        if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Rust (stable)
        if: steps.head.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Read only: CI (ci.yml) saves main's cache; the release run builds
      # with the same profile and does not save a second one.
      - name: Cargo-Cache
        if: steps.head.outputs.current == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install dependencies
        if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify
        if: steps.head.outputs.current == 'true'
        run: pnpm verify

      # Determine the version only after Verify, right before build and
      # release: the current time in UTC. If it is not strictly greater than
      # the highest existing tag `v<YYYY-MM-DD-HHMM>` (two pushes in the same
      # minute, clock behind), it becomes highest tag + 1 minute
      # (scripts/release-version.ts). The tags come from the API, the
      # checkout stays shallow.
      - name: Determine version
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")')
          version=$(printf '%s\n' "$tags" | node scripts/release-version.ts)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Sets the SemVer form of the version (YYYY.MMDD.HHMM) for the build in
      # package.json (not committed), runs tauri build --no-bundle, copies to
      # release/belegwerk-<version>.exe, writes the checksum and checks the
      # file version of the .exe (scripts/release.ts).
      - name: Build
        if: steps.head.outputs.current == 'true'
        run: node scripts/release.ts --calver "$env:VERSION"

      # Creates the tag `v<version>` on the built commit. Not a pre-release,
      # explicitly "Latest": the app reads `releases/latest`. `gh` uploads the
      # assets before it publishes the release.
      - name: Create GitHub release
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::No release: main moved on to $head during the build; the newer run publishes these commits."
            exit 0
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Belegwerk $VERSION" \
            --generate-notes \
            --latest \
            "release/belegwerk-$VERSION.exe" \
            "release/belegwerk-$VERSION.exe.sha256"
