name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PRs share a group (superseded runs are cancelled);
  # every push to main gets its own group and runs to completion.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Check & Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json (pnpm 12).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only main saves the cache; PRs restore it from main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Compiles the Paraglide messages (src/paraglide, gitignored) that tsc needs.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Schema (src/persistence/schema.ts) and committed migrations must
      # match: drizzle-kit must not generate a new migration.
      - name: Migrations up to date
        timeout-minutes: 5
        shell: bash
        run: |
          pnpm db:generate
          git add -N src/persistence/migrations
          git diff --exit-code -- src/persistence/migrations

      - name: Tauri build (no bundle)
        run: pnpm tauri build --no-bundle

      # Not a release – only for trying it out during review, kept briefly.
      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: belegwerk-${{ github.sha }}
          path: src-tauri/target/release/belegwerk.exe
          if-no-files-found: error
          retention-days: 7
